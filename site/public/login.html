<body class="bg-surface font-body text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-[#f5f7f6]/80 dark:bg-[#1a1c1c]/80 backdrop-blur-xl">

</div>
<a class="flex items-center gap-2 text-[#2c2f2f] dark:text-[#f5f7f6] opacity-70 hover:opacity-100 hover:scale-105 transition-all duration-300 font-headline font-bold tracking-tighter" href="#">
<span class="material-symbols-outlined text-sm">arrow_back</span>
<span>Shop</span>
</a>
</div>
</header>
<main class="flex-grow pt-24 pb-12 px-6 flex items-center justify-center">
<div class="max-w-6xl w-full flex flex-col md:flex-row gap-12 items-stretch">

<div class="w-full md:w-1/2 relative min-h-[500px] rounded-xl overflow-hidden group">
<img alt="Happy Golden Retriever and Ginger Cat cuddling" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="a happy golden retriever and a fluffy ginger cat sitting together in a sunlit modern living room with warm golden hour lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWEqBSSved5cLVE_FBkD8rurc8kMady_FhedsYuMiMJY2zPH4WtDOkZ2JE01pYlrzf9cpzCFBdt-qYbD247sae95QxKkApwYYT2UdOCL7hLnwbtLqCuTSDVOuqeqfebU9zQJgslMuyquTL8jRJPEC8RPWNNWjnffFFuPve7EnOt0YrDe8W7FwI1CAngs6HQYBxg9TILnXz4XY10x3bZ5SU8BXJcKEOFoa5xMiltz8ha72YMtpH8yz972egXeu7cu6A8KBl9tXbS94A"/>
<div class="absolute inset-0 hero-gradient"></div>
<div class="relative h-full flex flex-col justify-end p-10 md:p-14 z-10">
<h2 class="font-display font-extrabold text-white text-4xl md:text-5xl leading-tight tracking-tight mb-4">
                        Welcome Back to PetCare.
                    </h2>
<p class="text-white/90 text-lg md:text-xl font-body max-w-md">
                        Your pets miss you. Log in to track orders, manage subscriptions, and earn rewards.
                    </p>
</div>
<!-- Organic Shape Overlay -->
<div class="absolute -top-10 -right-10 w-48 h-48 bg-primary-container/30 rounded-full blur-3xl"></div>
</div>
<!-- Login/Signup Form Section -->
<div class="w-full md:w-1/2 flex flex-col justify-center">
<div class="bg-surface-container-lowest editorial-shadow rounded-lg p-8 md:p-12">
<!-- Tab Switcher -->
<div class="flex gap-8 mb-10 border-b border-surface-container">
<button class="pb-4 border-b-4 border-primary text-on-surface font-headline font-bold text-lg transition-colors">
                            Log In
                        </button>
<button class="pb-4 border-b-4 border-transparent text-on-surface/40 hover:text-on-surface/70 font-headline font-bold text-lg transition-colors">
                            Sign Up
                        </button>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="relative">
<input class="peer w-full px-6 py-4 rounded-full bg-surface-container-low border-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all font-body text-on-surface placeholder-transparent" id="email" name="email" placeholder="Email Address" type="email"/>
<label class="absolute left-6 top-4 text-on-surface/40 font-medium pointer-events-none transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-base peer-focus:-top-2 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:-top-2 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:text-primary bg-surface-container-lowest px-2" for="email">
                                Email Address
                            </label>
</div>
<!-- Password Field -->
<div class="relative">
<input class="peer w-full px-6 py-4 rounded-full bg-surface-container-low border-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all font-body text-on-surface placeholder-transparent" id="password" name="password" placeholder="Password" type="password"/>
<label class="absolute left-6 top-4 text-on-surface/40 font-medium pointer-events-none transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-base peer-focus:-top-2 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:-top-2 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:text-primary bg-surface-container-lowest px-2" for="password">
                                Password
                            </label>
<button class="absolute right-6 top-4 text-on-surface/40 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
<div class="flex justify-end">
<a class="text-xs font-label uppercase tracking-widest text-primary font-bold hover:underline" href="#">Forgot Password?</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-[#F4D35E] hover:bg-[#ebc335] active:scale-95 transition-all duration-300 py-4 px-10 rounded-full font-headline font-extrabold text-on-primary-container text-lg editorial-shadow" type="submit">
                            Log In
                        </button>
</form>
<!-- Divider -->
<div class="relative my-10 flex items-center">
<div class="flex-grow border-t border-surface-container-high"></div>
<span class="flex-shrink mx-4 text-xs font-label uppercase tracking-widest text-on-surface/40 font-medium">Or continue with</span>
<div class="flex-grow border-t border-surface-container-high"></div>
</div>

<span class="font-body font-semibold text-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-2 px-6 py-3 rounded-full border-2 border-surface-container-high hover:border-primary-container hover:bg-surface-container-low transition-all active:scale-95">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-body font-semibold text-sm">Apple</span>
</button>
<button class="flex items-center justify-center gap-2 px-6 py-3 rounded-full border-2 border-surface-container-high hover:border-primary-container hover:bg-surface-container-low transition-all active:scale-95">
<span class="material-symbols-outlined text-xl text-secondary" style="font-variation-settings: 'FILL' 1;">social_leaderboard</span>
<span class="font-body font-semibold text-sm">Facebook</span>
</button>
</div>
</div>
</div>
</div>

<a class="font-['Inter'] text-xs uppercase tracking-widest font-medium text-[#2c2f2f]/60 dark:text-[#f5f7f6]/60 hover:text-[#6e5a00] dark:hover:text-[#fcdb65] transition-colors" href="#">Terms of Service</a>
<a class="font-['Inter'] text-xs uppercase tracking-widest font-medium text-[#2c2f2f]/60 dark:text-[#f5f7f6]/60 hover:text-[#6e5a00] dark:hover:text-[#fcdb65] transition-colors" href="#">Legal</a>
</div>
</div>

</body></html>
